{% extends 'base.html' %}
{% block title %}Delete content - {{ site_config.site_name }}{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-lg">
    <div class="bg-white shadow-md rounded-lg p-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-4">Delete content?</h1>
        <p class="text-gray-600 mb-6">This will permanently delete “{{ object }}”. This can't be undone.</p>
        <form method="post">
            {% csrf_token %}
            <div class="flex justify-end">
                <a href="{% url 'content_calendar:content_table' %}" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded mr-2">Cancel</a>
                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Delete</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
